[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-assistant"
version = "0.1.0"
description = "Clinical Document Review Assistant (take-home): SOP-driven review API with evidence and human escalation"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "python-docx==1.2.0",
  "google-genai==2.27.0",
  "python-dotenv==1.2.4",
  "PyYAML==6.0.3",
  "httpx==0.28.1",
]

[project.scripts]
review-assistant = "review_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
